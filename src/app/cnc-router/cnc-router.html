<main>
  <section class="intro">
    <a class="back" routerLink="/" fragment="projects">← All projects</a>
    <p class="eyebrow">Mechanical Design · SolidWorks</p>
    <h1>CNC Router</h1>
    <p class="lead">{{ project.overview }}</p>
    <ul class="chips">
      @for (tag of project.tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>
  </section>

  <section class="render">
    <button type="button" class="shot blueprint" (click)="zoomed.set(true)">
      <img [src]="project.image" alt="CNC router SolidWorks assembly" />
      <span class="zoom">Click to enlarge</span>
    </button>
  </section>

  <section class="contribution">
    <h2>My contribution</h2>
    <ul>
      @for (item of project.contributions; track item) {
        <li>{{ item }}</li>
      }
    </ul>
  </section>
</main>

@if (zoomed()) {
  <div class="backdrop" (click)="close()">
    <article
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="CNC router assembly"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="close" aria-label="Close" (click)="close()">×</button>
      <div class="viewer">
        <img [src]="project.image" alt="CNC router SolidWorks assembly" />
      </div>
    </article>
  </div>
}
